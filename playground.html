    <!-- 主内容区 -->
    <main class="playground-main">
        <!-- 顶部工具栏 -->
        <div class="playground-toolbar">
            <div class="toolbar-left">
                <select id="problem-select" class="problem-select">
                    <!-- JS 动态填充 -->
                </select>
                <select id="language-select" class="problem-select language-select" aria-label="编程语言" title="编程语言">
                    <option value="python">Python 3</option>
                    <option value="java">Java 17</option>
                    <option value="go">Go</option>
                </select>
            </div>
            <div class="toolbar-right">
                <span id="runtime-status" class="pyodide-status loading">运行时加载中...</span>
                <button id="run-btn" class="btn btn-run" disabled>
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M4 2l10 6-10 6V2z" />
                    </svg>
                    运行代码
                </button>
                <button id="reset-btn" class="btn btn-reset">重置代码</button>
            </div>
        </div>

        <!-- 三栏布局：题目 | 编辑器+输出 | AI助手 -->
        <div class="playground-layout">
            <!-- 左侧：题目描述 -->
            <div class="panel panel-problem">
                <div class="panel-header">
                    <span class="panel-title">题目描述</span>
                </div>
                <div class="panel-body" id="problem-description">
                    <!-- JS 动态填充 -->
                </div>
                <div class="panel-footer" id="problem-footer">
                    <!-- JS 动态填充：题解链接 -->
                </div>
            </div>

            <!-- 中间：编辑器 + 输出 -->
            <div class="panel-right">
                <!-- 代码编辑器 -->
                <div class="panel panel-editor">
                    <div class="panel-header">
                        <span class="panel-title">代码编辑器</span>
                        <span id="language-hint" class="panel-hint">Python 3 · 核心代码模式</span>
                    </div>
                    <div class="panel-body editor-body">
                        <textarea id="code-editor"></textarea>
                    </div>
                </div>

                <!-- 输出/测试结果 -->
                <div class="panel panel-output">
                    <div class="panel-header">
                        <span class="panel-title">测试结果</span>
                        <span id="result-summary" class="result-summary"></span>
                    </div>
                    <div class="panel-body" id="output-area">
                        <div class="output-placeholder">点击「运行代码」查看测试结果</div>
                    </div>
                </div>
            </div>

            <!-- 右侧：AI 助手（点击 FAB 展开） -->
            <div id="ai-panel" class="ai-panel">
                <div class="ai-panel-header">
                    <div class="ai-panel-title">
                        <span class="ai-panel-title-icon">
                            <img class="ai-brand-icon" src="assets/images/ai-assistant-logo.svg" width="20" height="20" alt="" aria-hidden="true">
                        </span>
                        <span>AI 刷题助手</span>
                    </div>
                    <div class="ai-panel-actions">
                        <button id="ai-clear-btn" class="ai-icon-btn" title="清空对话">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 6h18" />
                                <path d="M8 6V4h8v2" />
                                <path d="M5 6v14a2 2 0 002 2h10a2 2 0 002-2V6" />
                            </svg>
                        </button>
                        <button id="ai-config-btn" class="ai-icon-btn" title="配置 API">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3" />
                                <path
                                    d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" />
                            </svg>
                        </button>
                        <button id="ai-close-btn" class="ai-icon-btn" title="关闭">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 6L6 18" />
                                <path d="M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div id="ai-messages" class="ai-messages">
                    <!-- JS 动态填充 -->
                </div>

                <div id="ai-quick-actions" class="ai-quick-actions">
                    <button class="ai-quick-btn" data-action="check-code">🔍 帮我看看代码</button>
                    <button class="ai-quick-btn" data-action="give-hint">💡 给个提示</button>
                    <button class="ai-quick-btn" data-action="explain-problem">📖 解释题目</button>
                    <button class="ai-quick-btn" data-action="explain-error">🐛 分析报错</button>

            <div class="ai-config-field">

            <div class="ai-config-field">

            </div>
            <div class="ai-config-actions">
                <button id="ai-config-cancel" class="ai-config-btn ai-config-btn-cancel">取消</button>
                <button id="ai-config-save" class="ai-config-btn ai-config-btn-save">保存配置</button>
            </div>
        </div>

    <!-- Theme toggle -->
    <script>
    (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        function currentTheme() {
            return document.documentElement.getAttribute('data-theme') || 'dark';
        }
        function syncEditorTheme(theme) {
            if (window.editor && window.editor.setOption) {
                window.editor.setOption('theme', theme === 'light' ? 'eclipse' : 'material-darker');
            }
        }
        btn.addEventListener('click', function () {
            var next = currentTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('z2l-theme', next);
            syncEditorTheme(next);
        });
        // Sync editor theme on init (after editor is created)
        var initCheck = setInterval(function () {
            if (window.editor) { syncEditorTheme(currentTheme()); clearInterval(initCheck); }
        }, 200);
        setTimeout(function () { clearInterval(initCheck); }, 10000);
    })();
    </script>
